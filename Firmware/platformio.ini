; MayDarkness 2026 - wireless mouse firmware
;
; Target: Raspberry Pi Pico W (RP2040 + CYW43439)
; Framework: arduino-pico (Earle Philhower)
;
; Notes:
;  - PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH switches the arduino-pico build to
;    liblwip-bt.a and enables the BTstack/BLE code needed by MouseBLE.
;  - USE_TINYUSB selects Adafruit TinyUSB, which is what provides the USB host
;    stack on the Pico W (the RP2040 has no native host controller, so host mode
;    is bit-banged with Pico-PIO-USB on GPIO16/17).
;  - USB host bit-banging requires a system clock that is a multiple of 12 MHz.
;    133 MHz is not, so run at 120 MHz (or 240 MHz).

[platformio]
default_envs = pico_w

[env:pico_w]
platform = raspberrypi
board = rpipicow
framework = arduino

board_build.f_cpu = 120000000L

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -D USE_TINYUSB
    ; USB host pins (D- is always D+ + 1). Change these in one place only.
    -D PIN_USB_HOST_DP=16
    -D PIN_USB_HOST_DM=17
    -D PIN_USB_VBUS_EN=18

lib_deps =
    sekigon-gonnoc/Pico PIO USB@^0.7.3
    wollewald/MPU9250_WE@^1.2.17

lib_compat_mode = off

monitor_speed = 115200
upload_protocol = picotool
